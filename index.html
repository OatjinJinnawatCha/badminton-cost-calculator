<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BadCal – Badminton Calculator</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-v2.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BadCal" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1558b0;
      --accent: #34a853;
      --danger: #ea4335;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --font-body: 'IBM Plex Sans Thai', system-ui, sans-serif;
      --font-display: 'Chakra Petch', 'IBM Plex Sans Thai', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px 16px 40px;
    }

    h1 {
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
      color: var(--primary);
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .field {
      margin-bottom: 16px;
    }

    /* Player list */
    #player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-row input {
      flex: 1;
    }

    .player-row .num {
      min-width: 26px;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .btn-remove {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: #fee2e2;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .btn-remove:hover {
      background: #fca5a5;
    }

    .btn-add {
      width: 100%;
      padding: 11px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-add:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    /* Calculate button */
    .btn-calc {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 16px;
    }

    .btn-calc:active {
      transform: scale(0.98);
    }

    .btn-calc:hover {
      background: var(--primary-dark);
    }

    /* Result card */
    #result-card {
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .result-header .section-title {
      margin-bottom: 0;
    }

    .btn-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: #2d9148;
    }

    .btn-copy.copied {
      background: #6b7280;
    }

    .summary-box {
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .summary-box .row {
      display: flex;
      font-variant-numeric: tabular-nums;
      justify-content: space-between;
    }

    .summary-box .row.total {
      border-top: 1.5px solid var(--border);
      margin-top: 8px;
      padding-top: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }

    .player-costs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-cost-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .player-name {
      font-weight: 600;
    }

    .player-amount {
      font-family: var(--font-display);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      font-size: 1.05rem;
    }

    .payee-box {
      margin-top: 16px;
      padding: 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }

    .payee-label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .payee-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .payee-promptpay {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      margin: -8px 0 12px;
    }

    .payee-qr {
      display: block;
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
      border-radius: 10px;
    }

    .btn-share {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2937;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-row input[type="checkbox"] {
      display: none;
    }

    .toggle-track {
      position: relative;
      width: 44px;
      height: 26px;
      background: #d1d5db;
      border-radius: 999px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .toggle-row input[type="checkbox"]:checked~.toggle-track {
      background: var(--primary);
    }

    .toggle-row input[type="checkbox"]:checked~.toggle-track::after {
      transform: translateX(18px);
    }

    .toggle-label {
      font-size: 0.95rem;
      font-weight: 600;
      flex: 1;
    }

    .toggle-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Custom date picker */
    .datepicker {
      position: relative;
    }

    .date-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s;
    }

    .date-trigger:focus,
    .datepicker.open .date-trigger {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .date-trigger .cal-icon {
      font-size: 1.1rem;
    }

    .cal-popover {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
      padding: 14px;
    }

    .datepicker.open .cal-popover {
      display: block;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
    }

    .cal-nav {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 1.2rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .cal-nav:hover {
      background: #dbeafe;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 0;
    }

    .cal-dow:first-child {
      color: var(--danger);
    }

    .cal-day {
      aspect-ratio: 1;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
    }

    .cal-day:hover {
      background: #eff6ff;
    }

    .cal-day.today {
      box-shadow: inset 0 0 0 1.5px var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .cal-day.selected {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .cal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .cal-today-btn {
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      background: #eff6ff;
      color: var(--primary);
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    @media (min-width: 480px) {
      body {
        padding: 24px;
      }

      .card {
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <h1>🏸 BadCal</h1>
  <p class="subtitle">Badminton Calculator · แบ่งค่าใช้จ่ายให้ยุติธรรม</p>

  <!-- Players -->
  <div class="card">
    <div class="section-title">👥 รายชื่อผู้เล่น</div>
    <div id="player-list"></div>
    <button class="btn-add" onclick="addPlayer()">+ เพิ่มผู้เล่น</button>
  </div>

  <!-- Game Info -->
  <div class="card">
    <div class="section-title">📋 ข้อมูลการเล่น</div>

    <div class="field">
      <label for="date-trigger">วันที่เล่น</label>
      <div class="datepicker" id="datepicker">
        <input type="hidden" id="play-date" />
        <button type="button" class="date-trigger" id="date-trigger" onclick="toggleCalendar()" aria-haspopup="dialog"
          aria-expanded="false">
          <span id="date-display">-</span>
          <span class="cal-icon">📅</span>
        </button>
        <div class="cal-popover" role="dialog" aria-label="เลือกวันที่">
          <div class="cal-header">
            <button type="button" class="cal-nav" onclick="shiftMonth(-1)" aria-label="เดือนก่อนหน้า">‹</button>
            <span class="cal-title" id="cal-title"></span>
            <button type="button" class="cal-nav" onclick="shiftMonth(1)" aria-label="เดือนถัดไป">›</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-footer">
            <button type="button" class="cal-today-btn" onclick="selectDate(todayISO())">วันนี้</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="shuttle-price">ราคาลูกแบด (บาท/ลูก)</label>
      <input type="number" id="shuttle-price" placeholder="0" min="0" step="1" inputmode="decimal" />
    </div>

    <div class="field">
      <label for="shuttle-count">จำนวนลูกที่ใช้</label>
      <input type="number" id="shuttle-count" placeholder="0" min="0" step="1" inputmode="numeric" />
    </div>

    <div class="field">
      <label for="court-cost">ค่าสนาม (บาท)</label>
      <input type="number" id="court-cost" placeholder="0" min="0" step="1" inputmode="decimal" />
    </div>

    <label class="toggle-row" for="round-up">
      <input type="checkbox" id="round-up" />
      <span class="toggle-track"></span>
      <span>
        <div class="toggle-label">ปัดเศษขึ้น</div>
        <div class="toggle-hint">ปัดค่าต่อคนขึ้นเป็นจำนวนเต็ม (Math.ceil)</div>
      </span>
    </label>
  </div>

  <button class="btn-calc" onclick="calculate()">คำนวณค่าใช้จ่าย</button>

  <!-- Result -->
  <div class="card" id="result-card">
    <div class="result-header">
      <div class="section-title">💰 สรุปค่าใช้จ่าย</div>
      <button class="btn-copy" id="copy-btn" onclick="copyToChat()">
        <span>📋</span> คัดลอก
      </button>
    </div>

    <div class="summary-box" id="summary-box"></div>
    <div class="player-costs" id="player-costs"></div>

    <div class="payee-box">
      <div class="payee-label">โอนเงินให้</div>
      <div class="payee-name" id="payee-display">-</div>
      <div class="payee-promptpay" id="promptpay-display"></div>
      <img class="payee-qr" src="MyQR.JPG" alt="QR พร้อมเพย์สำหรับโอนเงิน" />
      <button class="btn-share" id="copy-qr-btn" onclick="copyQR()" hidden>🖼️ คัดลอก QR</button>
      <button class="btn-share" id="share-btn" onclick="shareWithQR()" hidden>📤 แชร์ข้อความพร้อม QR</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let playerCount = 0;

    function addPlayer(name = '') {
      playerCount++;
      const list = document.getElementById('player-list');
      const row = document.createElement('div');
      row.className = 'player-row';
      row.dataset.id = playerCount;
      row.innerHTML = `
        <span class="num">${list.children.length + 1}</span>
        <input type="text" placeholder="ชื่อผู้เล่น" value="${name}" onkeydown="playerEnter(event, this)" />
        <button class="btn-remove" onclick="removePlayer(this)" title="ลบ">✕</button>
      `;
      list.appendChild(row);
      updateNumbers();
    }

    function removePlayer(btn) {
      const list = document.getElementById('player-list');
      if (list.children.length <= 1) {
        showToast('ต้องมีผู้เล่นอย่างน้อย 1 คน');
        return;
      }
      btn.closest('.player-row').remove();
      updateNumbers();
    }

    function playerEnter(e, input) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const inputs = [...document.querySelectorAll('#player-list .player-row input')];
      const idx = inputs.indexOf(input);
      if (idx < inputs.length - 1) {
        inputs[idx + 1].focus();
      } else {
        addPlayer();
        setTimeout(() => {
          const all = document.querySelectorAll('#player-list .player-row input');
          all[all.length - 1].focus();
        }, 0);
      }
    }

    function updateNumbers() {
      document.querySelectorAll('#player-list .player-row').forEach((row, i) => {
        row.querySelector('.num').textContent = i + 1;
      });
    }

    function getPlayers() {
      return [...document.querySelectorAll('#player-list .player-row input')]
        .map(i => i.value.trim() || `ผู้เล่น ${i.closest('.player-row').querySelector('.num').textContent}`);
    }

    function formatDate(val) {
      if (!val) return '-';
      const [y, m, d] = val.split('-');
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      return `${parseInt(d)} ${months[parseInt(m) - 1]} ${parseInt(y) + 543}`;
    }

    // Custom date picker
    const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    const THAI_DOW = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    let calView = { y: 0, m: 0 };

    function toISO(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function todayISO() {
      const t = new Date();
      return toISO(t.getFullYear(), t.getMonth(), t.getDate());
    }

    function renderCalendar() {
      const { y, m } = calView;
      const selected = document.getElementById('play-date').value;
      const today = todayISO();
      document.getElementById('cal-title').textContent = `${THAI_MONTHS[m]} ${y + 543}`;

      const firstDow = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      let html = THAI_DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
      html += '<div></div>'.repeat(firstDow);
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = toISO(y, m, d);
        const cls = ['cal-day', iso === today && 'today', iso === selected && 'selected'].filter(Boolean).join(' ');
        html += `<button type="button" class="${cls}" onclick="selectDate('${iso}')">${d}</button>`;
      }
      document.getElementById('cal-grid').innerHTML = html;
    }

    function shiftMonth(delta) {
      const d = new Date(calView.y, calView.m + delta, 1);
      calView = { y: d.getFullYear(), m: d.getMonth() };
      renderCalendar();
    }

    function selectDate(iso) {
      document.getElementById('play-date').value = iso;
      document.getElementById('date-display').textContent = formatDate(iso);
      closeCalendar();
    }

    function toggleCalendar() {
      const picker = document.getElementById('datepicker');
      if (picker.classList.contains('open')) { closeCalendar(); return; }
      const [y, m] = (document.getElementById('play-date').value || todayISO()).split('-').map(Number);
      calView = { y, m: m - 1 };
      renderCalendar();
      picker.classList.add('open');
      document.getElementById('date-trigger').setAttribute('aria-expanded', 'true');
    }

    function closeCalendar() {
      document.getElementById('datepicker').classList.remove('open');
      document.getElementById('date-trigger').setAttribute('aria-expanded', 'false');
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#datepicker')) closeCalendar();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeCalendar();
    });

    function fmt(num) {
      return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculate() {
      const players = getPlayers();
      const date = document.getElementById('play-date').value;
      const shuttlePrice = parseFloat(document.getElementById('shuttle-price').value) || 0;
      const shuttleCount = parseFloat(document.getElementById('shuttle-count').value) || 0;
      const courtCost = parseFloat(document.getElementById('court-cost').value) || 0;

      if (players.length === 0) { showToast('กรุณาเพิ่มผู้เล่นอย่างน้อย 1 คน'); return; }

      const roundUp = document.getElementById('round-up').checked;
      const shuttleCostTotal = shuttlePrice * shuttleCount;
      const total = shuttleCostTotal + courtCost;
      const perPersonExact = players.length > 0 ? total / players.length : 0;
      const perPerson = roundUp ? Math.ceil(perPersonExact) : perPersonExact;

      // Summary box
      const summaryBox = document.getElementById('summary-box');
      summaryBox.innerHTML = `
        <div class="row"><span>วันที่เล่น</span><span>${formatDate(date)}</span></div>
        <div class="row"><span>จำนวนผู้เล่น</span><span>${players.length} คน</span></div>
        <div class="row"><span>ค่าลูก (${shuttleCount} ลูก × ${fmt(shuttlePrice)} ฿)</span><span>${fmt(shuttleCostTotal)} ฿</span></div>
        <div class="row"><span>ค่าสนาม</span><span>${fmt(courtCost)} ฿</span></div>
        <div class="row total"><span>รวมทั้งหมด</span><span>${fmt(total)} ฿</span></div>
        ${roundUp ? `<div class="row"><span style="color:var(--muted);font-size:0.82rem">ปัดเศษขึ้นแล้ว (จาก ${fmt(perPersonExact)} ฿)</span></div>` : ''}
      `;

      // Per-person rows
      const costDiv = document.getElementById('player-costs');
      costDiv.innerHTML = players.map(name => `
        <div class="player-cost-row">
          <span class="player-name">${name}</span>
          <span class="player-amount">${fmt(perPerson)} ฿</span>
        </div>
      `).join('');

      document.getElementById('payee-display').textContent = getPayee() || '-';
      document.getElementById('promptpay-display').textContent =
        PAYEE_PROMPTPAY ? `พร้อมเพย์ ${formatPromptPay(PAYEE_PROMPTPAY)}` : '';

      const resultCard = document.getElementById('result-card');
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    const PAYEE_NAME = 'จิณณวัตร เจริญศิลป์';
    const PAYEE_PROMPTPAY = '0910317150';

    // 10 digits = phone (091-031-7150), 13 digits = national ID (1-2345-67890-12-3)
    function formatPromptPay(num) {
      const d = num.replace(/\D/g, '');
      if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
      if (d.length === 13) return d.replace(/(\d)(\d{4})(\d{5})(\d{2})(\d)/, '$1-$2-$3-$4-$5');
      return num;
    }

    function getPayee() {
      return PAYEE_NAME;
    }

    function buildMessage() {
      const players = getPlayers();
      const date = document.getElementById('play-date').value;
      const shuttlePrice = parseFloat(document.getElementById('shuttle-price').value) || 0;
      const shuttleCount = parseFloat(document.getElementById('shuttle-count').value) || 0;
      const courtCost = parseFloat(document.getElementById('court-cost').value) || 0;

      const roundUp = document.getElementById('round-up').checked;
      const shuttleCostTotal = shuttlePrice * shuttleCount;
      const total = shuttleCostTotal + courtCost;
      const perPersonExact = total / players.length;
      const perPerson = roundUp ? Math.ceil(perPersonExact) : perPersonExact;

      let msg = `🏸 สรุปค่าแบดมินตัน\n`;
      msg += `📅 วันที่: ${formatDate(date)}\n`;
      msg += `─────────────────\n`;
      msg += `🪶 ค่าลูก: ${shuttleCount} ลูก × ${fmt(shuttlePrice)} ฿ = ${fmt(shuttleCostTotal)} ฿\n`;
      msg += `🏟️ ค่าสนาม: ${fmt(courtCost)} ฿\n`;
      msg += `💰 รวม: ${fmt(total)} ฿\n`;
      msg += `👥 ผู้เล่น ${players.length} คน\n`;
      msg += `─────────────────\n`;
      msg += players.map(n => `• ${n} → ${fmt(perPerson)} ฿`).join('\n');

      const payee = getPayee();
      if (payee) {
        msg += `\n─────────────────\n`;
        msg += `💳 โอนเงินให้: ${payee}`;
      }
      if (PAYEE_PROMPTPAY) {
        msg += payee ? '\n' : `\n─────────────────\n`;
        msg += `📱 พร้อมเพย์: ${formatPromptPay(PAYEE_PROMPTPAY)}`;
      }
      return msg;
    }

    let qrFile = null;

    async function loadQRFile() {
      try {
        const blob = await (await fetch('MyQR.JPG')).blob();
        const file = new File([blob], 'MyQR.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          qrFile = file;
          document.getElementById('share-btn').hidden = false;
        }
      } catch (e) { }
    }

    async function shareWithQR() {
      try {
        await navigator.share({ text: buildMessage(), files: [qrFile] });
      } catch (e) {
        if (e.name !== 'AbortError') showToast('แชร์ไม่สำเร็จ');
      }
    }

    // Clipboard images must be PNG (Safari/Chrome reject JPEG), so convert once up front
    let qrPngPromise = null;

    function getQRPng() {
      if (!qrPngPromise) {
        qrPngPromise = new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            canvas.getContext('2d').drawImage(img, 0, 0);
            canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
          };
          img.onerror = reject;
          img.src = 'MyQR.JPG';
        });
        qrPngPromise.catch(() => { qrPngPromise = null; });
      }
      return qrPngPromise;
    }

    function markCopied(toastMsg) {
      const btn = document.getElementById('copy-btn');
      btn.classList.add('copied');
      btn.innerHTML = '<span>✅</span> คัดลอกแล้ว';
      showToast(toastMsg);
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<span>📋</span> คัดลอก';
      }, 2500);
    }

    function copyTextOnly(msg) {
      return navigator.clipboard.writeText(msg).catch(() => {
        // fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = msg;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
    }

    function copyToChat() {
      copyTextOnly(buildMessage()).then(() => markCopied('คัดลอกข้อความแล้ว!'));
    }

    // Chat apps paste only one clipboard item, so the QR gets its own button
    function copyQR() {
      // Pass the PNG as a promise so the write stays inside the tap gesture (required by iOS Safari)
      navigator.clipboard.write([new ClipboardItem({ 'image/png': getQRPng() })])
        .then(() => showToast('คัดลอก QR แล้ว!'))
        .catch(() => showToast('คัดลอก QR ไม่สำเร็จ'));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Init with 2 default players and today's date
    addPlayer();
    addPlayer();
    selectDate(todayISO());
    loadQRFile();
    if (window.ClipboardItem && navigator.clipboard?.write) {
      document.getElementById('copy-qr-btn').hidden = false;
      getQRPng();
    }
  </script>
</body>

</html>
